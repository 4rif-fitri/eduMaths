<!DOCTYPE html>
<html lang="ms">

<head>
	<meta charset="UTF-8">

	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Game Padankan</title>

	<link rel="stylesheet" href="../../src/style/lesson.css">

	<link rel="stylesheet" href="../../src/style/game.css">

	<style>
		.boxSoalan,
		.boxJawapan {
			cursor: pointer;

			transition:
				transform 0.2s,
				background-color 0.2s,
				border-color 0.2s;
		}

		.boxSoalan:hover,
		.boxJawapan:hover {
			transform: translateY(-3px);
		}

		.boxSoalan.selected,
		.boxJawapan.selected {
			color: #0b2f68;
			background-color: #dbeafe;
			border: 4px solid #3b82f6;
		}

		.boxSoalan.wrong,
		.boxJawapan.wrong {
			color: #991b1b;
			background-color: #fee2e2;
			border-color: #ef4444;
		}

		.boxSoalan.matched,
		.boxJawapan.matched {
			color: #166534;
			background-color: #dcfce7;
			border-color: #22c55e;
			opacity: 0.7;
		}
	</style>
</head>

<body>

	<div class="container">
		<main>

			<header>
				<div>
					<a href="./index.html">
						<p class="x">x</p>
					</a>

					<div class="barContainer">
						<p class="text-bar">
							0/0 Aktiviti
						</p>

						<div class="bar">
							<div class="barFill"></div>
						</div>
					</div>
				</div>
			</header>

			<section id="main">

				<div class="dialogContainer">
					<div class="icon"></div>

					<div class="dialog">
						<p></p>
					</div>
				</div>

				<div class="contentContainer"></div>

			</section>

			<footer>

				<div class="textContainer">
					<h2 class="hidden"></h2>
					<p class="hidden"></p>
				</div>

				<div class="btnContainer">

					<button type="button" class="btnContinue soft-box hidden">
						CONTINUE
					</button>

					<button type="button" class="btnCheck soft-box hidden">
						CHECK
					</button>

				</div>

			</footer>

		</main>
	</div>

	<script type="module">

		import {
			widgetRegistry
		} from "../../src/js/utils/widgetRegistry.js";


		// =====================================
		// 1. ARRAY COMPONENT
		// =====================================

		const json = [
			{
				id: "padankan-set-1",

				text:
					"Padankan soalan dengan jawapan yang betul",

				type: "padankan",

				content: {
					items: [
						{
							text: "Padankan yang betul",

							type: "padankan",

							content: {
								question: "1 + 1"
							},

							answer: 2
						},
						{
							text: "Padankan yang betul",

							type: "padankan",

							content: {
								question: "1 + 2"
							},

							answer: 3
						},
						{
							text: "Padankan yang betul",

							type: "padankan",

							content: {
								question: "1 + 3"
							},

							answer: 4
						},
						{
							text: "Padankan yang betul",

							type: "padankan",

							content: {
								question: "2 + 3"
							},

							answer: 5
						}
					]
				}
			},

			/*
				Selepas component pertama selesai,
				index akan bergerak ke component ini.
			*/

			{
				id: "padankan-set-2",

				text:
					"Padankan kumpulan kedua",

				type: "padankan",

				content: {
					items: [
						{
							text: "Padankan yang betul",

							type: "padankan",

							content: {
								question: "2 + 4"
							},

							answer: 6
						},
						{
							text: "Padankan yang betul",

							type: "padankan",

							content: {
								question: "3 + 4"
							},

							answer: 7
						},
						{
							text: "Padankan yang betul",

							type: "padankan",

							content: {
								question: "3 + 5"
							},

							answer: 8
						},
						{
							text: "Padankan yang betul",

							type: "padankan",

							content: {
								question: "4 + 5"
							},

							answer: 9
						}
					]
				}
			}
		];


		// =====================================
		// 2. STATE INDEX SAHAJA
		// =====================================

		const state = {
			index: 0,

			phase: "rendering",

			currentResult: null,

			cleanup: null
		};


		// =====================================
		// 3. UI
		// =====================================

		const ui = {
			contentContainer:
				document.querySelector(
					".contentContainer"
				),

			dialog:
				document.querySelector(
					".dialog p"
				),

			textBar:
				document.querySelector(
					".text-bar"
				),

			barFill:
				document.querySelector(
					".barFill"
				),

			btnCheck:
				document.querySelector(
					".btnCheck"
				),

			btnContinue:
				document.querySelector(
					".btnContinue"
				)
		};


		// =====================================
		// 4. PAPARKAN MESEJ
		// =====================================

		function showMessage(
			message,
			status = "normal"
		) {
			ui.dialog.textContent = message;

			ui.dialog.classList.remove(
				"textBetul",
				"textSalah"
			);

			if (status === "correct") {
				ui.dialog.classList.add(
					"textBetul"
				);
			}

			if (status === "wrong") {
				ui.dialog.classList.add(
					"textSalah"
				);
			}
		}


		// =====================================
		// 5. PROGRESS DALAMAN COMPONENT
		// =====================================

		function updateSubProgress(
			completed,
			total,
			attempts
		) {
			const percentage =
				total === 0
					? 0
					: (completed / total) * 100;

			ui.textBar.textContent =
				`${completed}/${total} Pasangan` +
				` | ${attempts} Percubaan`;

			ui.barFill.style.width =
				`${percentage}%`;
		}


		// =====================================
		// 6. RENDER COMPONENT SEMASA
		// =====================================

		function renderCurrentComponent() {
			/*
				Bersihkan event listener daripada
				component sebelumnya.
			*/

			state.cleanup?.();

			state.cleanup = null;
			state.currentResult = null;

			const currentData =
				json[state.index];

			if (!currentData) {
				finishAllComponents();
				return;
			}

			const component =
				widgetRegistry[currentData.type];

			if (!component) {
				console.error(
					`Component "${currentData.type}" ` +
					`tidak dijumpai.`
				);

				showMessage(
					`Component "${currentData.type}" ` +
					`tidak dijumpai.`,
					"wrong"
				);

				return;
			}

			if (!component.mount) {
				console.error(
					`Component "${currentData.type}" ` +
					`tiada fungsi mount().`
				);

				showMessage(
					`Component "${currentData.type}" ` +
					`tidak boleh dimulakan.`,
					"wrong"
				);

				return;
			}

			state.phase = "playing";

			ui.btnCheck.classList.add("hidden");
			ui.btnContinue.classList.add("hidden");

			showMessage(currentData.text);

			/*
				Index hanya sediakan root kosong.
				Component akan render dirinya sendiri.
			*/

			const root =
				document.createElement("div");

			root.className = "output w-100";

			ui.contentContainer.replaceChildren(
				root
			);

			/*
				Mount component berdasarkan type.
			*/

			state.cleanup = component.mount({
				root,

				data: currentData,

				ui: {
					showMessage,
					updateSubProgress
				},

				complete: handleComponentComplete
			});
		}


		// =====================================
		// 7. COMPONENT SUDAH SIAP
		// =====================================

		function handleComponentComplete(result) {
			/*
				Elakkan complete dipanggil
				lebih daripada sekali.
			*/

			if (state.phase !== "playing") {
				return;
			}

			state.phase = "component-complete";
			state.currentResult = result;

			const isLastComponent =
				state.index === json.length - 1;

			ui.btnContinue.textContent =
				isLastComponent
					? "FINISH"
					: "CONTINUE";

			ui.btnContinue.classList.remove(
				"hidden"
			);
		}


		// =====================================
		// 8. PERGI COMPONENT SETERUSNYA
		// =====================================

		function handleContinue() {
			if (
				state.phase !==
				"component-complete"
			) {
				return;
			}

			state.index++;

			renderCurrentComponent();
		}


		// =====================================
		// 9. SEMUA COMPONENT SELESAI
		// =====================================

		function finishAllComponents() {
			state.cleanup?.();

			state.cleanup = null;
			state.phase = "complete";

			showMessage(
				"Semua aktiviti telah selesai!",
				"correct"
			);

			ui.contentContainer.innerHTML = `
				<div class="output">
					<div class="soft-box p-2">
						<h1>Tahniah!</h1>

						<p>
							Anda telah menyelesaikan
							semua aktiviti.
						</p>
					</div>
				</div>
			`;

			ui.textBar.textContent =
				`${json.length}/${json.length} Aktiviti`;

			ui.barFill.style.width = "100%";

			ui.btnCheck.classList.add("hidden");
			ui.btnContinue.classList.add("hidden");

			localStorage.setItem(
				"game8Completed",
				"true"
			);
		}


		// =====================================
		// 10. EVENT
		// =====================================

		ui.btnContinue.addEventListener(
			"click",
			handleContinue
		);


		// =====================================
		// 11. MULA
		// =====================================

		renderCurrentComponent();

	</script>

</body>

</html>
