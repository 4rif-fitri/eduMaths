<!DOCTYPE html>
<html lang="ms">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Game Padankan</title>
	<link rel="stylesheet" href="../../src/style/lesson.css">
	<link rel="stylesheet" href="../../src/style/game.css">
</head>

<body>

	<div class="container">
		<main>

			<header>
				<div>
					<a href="./index.html">
						<p class="x">x</p>
					</a>

					<div class="barContainer">
						<p class="text-bar">
							0/0 Aktiviti
						</p>

						<div class="bar">
							<div class="barFill"></div>
						</div>
					</div>
				</div>
			</header>

			<section id="main">

				<div class="dialogContainer">
					<div class="icon"></div>

					<div class="dialog">
						<p></p>
					</div>
				</div>

				<div class="contentContainer"></div>

			</section>

			<footer>

				<div class="textContainer">
					<h2 class="hidden"></h2>
					<p class="hidden"></p>
				</div>

				<div class="btnContainer">

					<button type="button" class="btnContinue soft-box hidden">
						CONTINUE
					</button>

					<button type="button" class="btnCheck soft-box hidden">
						CHECK
					</button>

				</div>

			</footer>

		</main>
	</div>

	<script type="module">
		import {
			widgetRegistry
		} from "../../src/js/utils/widgetRegistry.js";

		const json = [
			{
				id: "padankan-set-1",
				text: "Padankan soalan dengan jawapan yang betul",
				type: "padankan",
				content: {
					items: [
						{
							text: "Padankan yang betul",
							type: "padankan",
							content: {
								question: "1 + 1"
							},
							answer: 2
						},
						{
							text: "Padankan yang betul",
							type: "padankan",
							content: {
								question: "1 + 2"
							},
							answer: 3
						},
						{
							text: "Padankan yang betul",
							type: "padankan",
							content: {
								question: "1 + 3"
							},
							answer: 4
						},
						{
							text: "Padankan yang betul",
							type: "padankan",
							content: {
								question: "2 + 3"
							},
							answer: 5
						}
					]
				}
			},

			{
				id: "padankan-set-2",

				text:
					"Padankan kumpulan kedua",

				type: "padankan",

				content: {
					items: [
						{
							text: "Padankan yang betul",

							type: "padankan",

							content: {
								question: "2 + 4"
							},

							answer: 6
						},
						{
							text: "Padankan yang betul",

							type: "padankan",

							content: {
								question: "3 + 4"
							},

							answer: 7
						},
						{
							text: "Padankan yang betul",

							type: "padankan",

							content: {
								question: "3 + 5"
							},

							answer: 8
						},
						{
							text: "Padankan yang betul",

							type: "padankan",

							content: {
								question: "4 + 5"
							},

							answer: 9
						}
					]
				}
			}
		];

		const state = {
			index: 0,
			phase: "rendering",
			currentResult: null,
			cleanup: null
		};

		const ui = {
			contentContainer:document.querySelector(".contentContainer"),
			dialog:document.querySelector(".dialog p"),
			textBar:document.querySelector(".text-bar"),
			barFill:document.querySelector(".barFill"),
			btnCheck:document.querySelector(".btnCheck"),
			btnContinue:document.querySelector(".btnContinue")
		};

		function showMessage(message,	status = "normal") {
			ui.dialog.textContent = message;

			ui.dialog.classList.remove("textBetul","textSalah");

			if (status === "correct") {
				ui.dialog.classList.add("textBetul");
			}

			if (status === "wrong") {
				ui.dialog.classList.add("textSalah");
			}
		}

		function updateSubProgress(completed,total,attempts) {
			const percentage =
				total === 0
					? 0
					: (completed / total) * 100;

			ui.textBar.textContent =
				`${completed}/${total} Pasangan` +
				` | ${attempts} Percubaan`;

			ui.barFill.style.width =
				`${percentage}%`;
		}

		function renderCurrentComponent() {
			state.cleanup?.();

			state.cleanup = null;
			state.currentResult = null;

			let currentData = json[state.index];

			if (!currentData) {
				finishAllComponents();
				return;
			}

			let component = widgetRegistry[currentData.type];

			state.phase = "playing";

			ui.btnCheck.classList.add("hidden");
			ui.btnContinue.classList.add("hidden");

			showMessage(currentData.text);

			let div = document.createElement("div");
			div.className = "output w-100";
			ui.contentContainer.replaceChildren(div);

			state.cleanup = component.mount({
				div,
				data: currentData,
				ui: {
					showMessage,
					updateSubProgress
				},
				complete: handleComponentComplete
			});
		}

		function handleComponentComplete(result) {
			if (state.phase !== "playing") return

			state.phase = "component-complete";
			state.currentResult = result;

			const isLastComponent = state.index === json.length - 1;

			ui.btnContinue.textContent =
				isLastComponent
					? "FINISH"
					: "CONTINUE";

			ui.btnContinue.classList.remove("hidden");
		}


		function handleContinue() {
			if (state.phase !== "component-complete") return

			state.index++;

			renderCurrentComponent();
		}


		function finishAllComponents() {
			state.cleanup?.();

			state.cleanup = null;
			state.phase = "complete";

			showMessage("Semua aktiviti telah selesai!", "correct");

			ui.contentContainer.innerHTML = `
				<div class="output">
					<div class="soft-box p-2">
						<h1>Tahniah!</h1>

						<p>
							Anda telah menyelesaikan
							semua aktiviti.
						</p>
					</div>
				</div>
			`;

			ui.textBar.textContent = `${json.length}/${json.length} Aktiviti`;
			ui.barFill.style.width = "100%";
			ui.btnCheck.classList.add("hidden");
			ui.btnContinue.classList.add("hidden");
		}

		ui.btnContinue.addEventListener("click", handleContinue);

		renderCurrentComponent();
	</script>

</body>

</html>
