<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link rel="stylesheet" href="../../src/style/lesson.css">
	<link rel="stylesheet" href="../../src/style/game.css">
</head>

<body>
	<div class="container">
		<main>
			<header>

				<div>
					<a href="./index.html">
						<p class="x">x</p>
					</a>
					<div class="barContainer">
						<p class="text-bar">1/10 Slide</p>
						<div class="bar">
							<div class="barFill"></div>
						</div>
					</div>
				</div>

			</header>

			<section id="main">

				<div class="dialogContainer">
					<div class="icon"></div>
					<div class="dialog">
						<p></p>
					</div>
				</div>

				<div class="contentContainer">


				</div>

			</section>

			<footer class="">
				<div class="textContainer textBetul">
					<h2 class="hidden"></h2>
					<p class="hidden"></p>
				</div>
				<div class="btnContainer">
					<button class="btnContinue soft-box hidden">CONTINUE</button>
					<button class="btnCheck soft-box ">CHECK</button>
				</div>
			</footer>
		</main>
	</div>

	<script type="module">

		import { widgetRegistry } from "../../src/js/utils/widgetRegistry.js"
		import { showWrong, showCorrect, resetContentFooter, showPopUpDone } from "../../src/js/utils/helper.js"

		const ori = [
			{
				text: "Cari pasangan yang membentuk 10",
				type: "teknikTambahTiga",
				content: {
					numbers: [5, 5, 3]
				}
			},
			{
				text: "Cari pasangan yang membentuk 10",
				type: "teknikTambahTiga",
				content: {
					numbers: [5, 7, 3]
				}
			},
			{
				text: "Cari pasangan yang membentuk 10",
				type: "teknikTambahTiga",
				content: {
					numbers: [1, 8, 2]
				}
			},
			{
				text: "Cari pasangan yang membentuk 10",
				type: "teknikTambahTiga",
				content: {
					numbers: [6, 4, 7]
				}
			},
			{
				text: "Cari pasangan yang membentuk 10",
				type: "teknikTambahTiga",
				content: {
					numbers: [1, 9, 7]
				}
			},
			{
				text: "Cari pasangan yang membentuk 10",
				type: "teknikTambahTiga",
				content: {
					numbers: [5, 3, 7]
				}
			},
			{
				text: "Cari pasangan yang membentuk 10",
				type: "teknikTambahTiga",
				content: {
					numbers: [9, 5, 5]
				}
			},
			{
				text: "Cari pasangan yang membentuk 10",
				type: "teknikTambahTiga",
				content: {
					numbers: [4, 6, 3]
				}
			}
		];

		function findPair10(numbers) {
			// Utamakan pasangan bersebelahan seperti gambar.
			for (let index = 0; index < numbers.length - 1; index++) {
				if (numbers[index] + numbers[index + 1] === 10) {
					return [index, index + 1];
				}
			}

			// Fallback jika pasangan tidak bersebelahan.
			for (let first = 0; first < numbers.length; first++) {
				for (
					let second = first + 1;
					second < numbers.length;
					second++
				) {
					if (
						numbers[first] +
						numbers[second] === 10
					) {
						return [first, second];
					}
				}
			}

			return null;
		}

		function generateJsonThree(data) {
			const numbers =
				data.content.numbers.map(Number);

			if (numbers.length !== 3) {
				throw new Error(
					"Teknik tiga nombor mesti mempunyai 3 nombor."
				);
			}

			const pairIndices = findPair10(numbers);

			if (!pairIndices) {
				throw new Error(
					`Tiada pasangan membentuk 10 dalam ${numbers.join(", ")}`
				);
			}

			const remainingIndex =
				numbers.findIndex(
					(_, index) =>
						!pairIndices.includes(index)
				);

			const pair = pairIndices.map(
				index => numbers[index]
			);

			const remaining =
				numbers[remainingIndex];

			const total = numbers.reduce(
				(sum, number) => sum + number,
				0
			);

			const content = {
				numbers,
				pairIndices,
				pair,
				remainingIndex,
				remaining,
				total
			};

			return [
				{
					text:
						"Pilih dua nombor yang membentuk 10",

					type: "PickPair10",
					content,

					// Simpan index kerana 5 + 5 mempunyai nilai sama.
					answer: pairIndices
				},
				{
					text:
						`Bagus! Sekarang kira 10 tambah ${remaining}`,

					type: "SumThree10",
					content,

					options: createOptions(total),
					answer: total
				}
			];
		}

		function createOptions(answer) {
			const options = new Set([answer]);

			while (options.size < 3) {
				const randomOffset = Math.floor(Math.random() * 5) - 2;
				const option = answer + randomOffset;

				if (option >= 0) {
					options.add(option);
				}
			}

			return [...options].sort(() => Math.random() - 0.5);
		}

		let json = generateJsonThree(ori[0]);
		console.log(json);
		
		let state = {
			stepIndex: 0,
			index: 0,
			isCorrect: null,
			numberPicked: null,
			elementPicked: null,

			currentData: null,
			question: null,

			isReset: false
		};

		let ui = {
			barFill: document.querySelector(".barFill"),

			btnCheck: document.querySelector(".btnCheck"),
			btnContinue: document.querySelector(".btnContinue"),
			footer: document.querySelector("footer"),
			textBar: document.querySelector(".text-bar"),
			textFooter: document.querySelector("footer h2"),
			dialogText: document.querySelector(".dialog p"),
			contentContainer: document.querySelector(".contentContainer"),
		}

		function goToNextExercise() {
			state.stepIndex++;

			if (state.stepIndex >= ori.length) {
				ui.barFill.style.width = "100%";
				showPopUpDone();
				return;
			}

			json = generateJsonThree(
				ori[state.stepIndex]
			);

			state.index = 0;
			state.numberPicked = null;
			state.elementPicked = null;
			state.isReset = false;
			state.isCorrect = false;

			main();
		}

		function updateProgress() {
			const completedBefore =
				state.stepIndex * json.length;

			const currentProgress =
				completedBefore + state.index;

			const totalProgress =
				ori.length * json.length;

			const percentage =
				(currentProgress / totalProgress) * 100;

			ui.barFill.style.width = `${percentage}%`;
		}

		function handleCheck() {
			if (
				state.numberPicked === null ||
				state.isReset
			) {
				return;
			}

			state.isReset = true;

			state.isCorrect =
				state.question.check(
					state.numberPicked,
					state.currentData
				);

			if (state.isCorrect) {
				showCorrect(ui);

				state.question.afterCorrect?.(
					state.numberPicked,
					state.currentData
				);
			} else {
				showWrong(ui);
			}
		}
		function handleContinue() {
			resetContentFooter(ui);

			if (state.isCorrect) {
				state.index++;
			}

			state.numberPicked = null;
			state.elementPicked = null;
			state.isReset = false;
			state.isCorrect = false;

			/*
				Jika salah, render semula step yang sama.
				Ini juga membersihkan pilihan dua nombor.
			*/
			main();
		}

		function main() {
			if (state.index >= json.length) {
				goToNextExercise();
				return;
			}

			const data = json[state.index];

			state.currentData = data;
			state.question = widgetRegistry[data.type];

			ui.contentContainer.innerHTML = `
				<div class="output" style="width: 100%">
					${state.question.render(data)}
				</div>`;

			ui.dialogText.textContent = data.text;

			ui.textBar.textContent = `${state.index + 1}/${json.length} Questions`;

			state.question.setup?.((value, element) => {
					state.numberPicked = value;
					state.elementPicked = element ?? null;
				},
				() => !state.isReset
			);

			updateProgress();
		}

		main()

		ui.btnCheck.addEventListener("click", handleCheck);
		ui.btnContinue.addEventListener("click", handleContinue);

	</script>
</body>

</html>
