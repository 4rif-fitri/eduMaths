<!DOCTYPE html>
<html lang="ms">

<head>
	<meta charset="UTF-8">

	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Memory Game</title>

	<link rel="stylesheet" href="../../src/style/lesson.css">

	<link rel="stylesheet" href="../../src/style/game.css">
</head>

<body>

	<div class="container">
		<main>

			<header>
				<div>

					<a href="./index.html">
						<p class="x">x</p>
					</a>

					<div class="barContainer">

						<p class="text-bar">
							0/8 Pasangan
						</p>

						<div class="bar">
							<div class="barFill"></div>
						</div>

					</div>

				</div>
			</header>

			<section id="main">

				<div class="dialogContainer">

					<div class="icon"></div>

					<div class="dialog">
						<p>
							Tekan dua kad untuk mencari
							pasangan yang sama.
						</p>
					</div>

				</div>

				<div class="contentContainer">

					<div class="output">

						<!-- Kad dijana daripada JSON -->
						<div class="memory-container grid-4"></div>

					</div>

				</div>

			</section>

			<footer>

				<div class="textContainer textBetul">
					<h2 class="hidden"></h2>
					<p class="hidden"></p>
				</div>

				<div class="btnContainer">

					<button type="button" class="btnContinue soft-box hidden">
						MAIN SEMULA
					</button>

					<button type="button" class="btnCheck soft-box hidden">
						CHECK
					</button>

				</div>

			</footer>

		</main>
	</div>

	<script type="module">

		const json = [
			{
				id: "memory-game-1",

				text:
					"Tekan dua kad untuk mencari pasangan operasi dan jawapan.",

				type: "MemoryGame",

				content: {
					cardIcon: "📗",

					items: [
						{
							text:
								"Cari pasangan yang sama",

							type: "MemoryGame",

							content: {
								question: "1 + 1"
							},

							answer: 2
						},
						{
							text:
								"Cari pasangan yang sama",

							type: "MemoryGame",

							content: {
								question: "1 + 2"
							},

							answer: 3
						},
						{
							text:
								"Cari pasangan yang sama",

							type: "MemoryGame",

							content: {
								question: "1 + 3"
							},

							answer: 4
						},
						{
							text:
								"Cari pasangan yang sama",

							type: "MemoryGame",

							content: {
								question: "2 + 3"
							},

							answer: 5
						},
						{
							text:
								"Cari pasangan yang sama",

							type: "MemoryGame",

							content: {
								question: "2 + 4"
							},

							answer: 6
						},
						{
							text:
								"Cari pasangan yang sama",

							type: "MemoryGame",

							content: {
								question: "3 + 4"
							},

							answer: 7
						},
						{
							text:
								"Cari pasangan yang sama",

							type: "MemoryGame",

							content: {
								question: "3 + 5"
							},

							answer: 8
						},
						{
							text:
								"Cari pasangan yang sama",

							type: "MemoryGame",

							content: {
								question: "4 + 5"
							},

							answer: 9
						}
					]
				}
			}
		];

		const currentData = json[0];

		const items =
			currentData.content.items;

		const totalPairs =
			items.length;

		const state = {
			firstCard: null,
			secondCard: null,

			isLocked: false,

			matchedPairs: 0,
			attempts: 0,

			phase: "playing",

			timeoutId: null
		};

		const ui = {
			memoryContainer:
				document.querySelector(
					".memory-container"
				),

			dialog:
				document.querySelector(
					".dialog p"
				),

			textBar:
				document.querySelector(
					".text-bar"
				),

			barFill:
				document.querySelector(
					".barFill"
				),

			btnContinue:
				document.querySelector(
					".btnContinue"
				),

			btnCheck:
				document.querySelector(
					".btnCheck"
				)
		};

		ui.btnCheck.classList.add("hidden");


		// =====================================
		// 5. SHUFFLE
		// =====================================

		function shuffle(data) {
			const result = [...data];

			for (
				let i = result.length - 1;
				i > 0;
				i--
			) {
				const randomIndex =
					Math.floor(
						Math.random() * (i + 1)
					);

				[
					result[i],
					result[randomIndex]
				] = [
						result[randomIndex],
						result[i]
					];
			}

			return result;
		}


		// =====================================
		// 6. BINA DECK DARIPADA JSON
		// =====================================

		function createDeck() {
			const deck = items.flatMap(
				(item, index) => {
					const pairId =
						`pair-${index}`;

					return [
						{
							cardId:
								`${pairId}-question`,

							pairId,

							value:
								item.content.question
						},

						{
							cardId:
								`${pairId}-answer`,

							pairId,

							value:
								item.answer
						}
					];
				}
			);

			return shuffle(deck);
		}


		// =====================================
		// 7. RENDER KAD
		// =====================================

		function renderCards() {
			const deck = createDeck();

			const cardIcon =
				currentData.content.cardIcon ??
				"📗";

			ui.memoryContainer.innerHTML =
				deck.map(card => `
					<div
						class="card"
						data-card-id="${card.cardId}"
						data-pair-id="${card.pairId}"
					>
						<div class="innerCard">

							<div class="back">
								<h3>
									${card.value}
								</h3>
							</div>

							<div class="front">
								<h1>
									${cardIcon}
								</h1>
							</div>

						</div>
					</div>
				`).join("");
		}


		// =====================================
		// 8. FLIP KAD
		// =====================================

		function flipCard(card) {
			card.classList.add(
				"flip",
				"flipped"
			);

			const innerCard =
				card.querySelector(
					".innerCard"
				);

			innerCard.style.transform =
				"rotateY(180deg)";
		}

		function unflipCard(card) {
			if (!card) return;

			card.classList.remove(
				"flip",
				"flipped"
			);

			const innerCard =
				card.querySelector(
					".innerCard"
				);

			innerCard.style.transform =
				"rotateY(0deg)";
		}


		// =====================================
		// 9. UPDATE PROGRESS
		// =====================================

		function updateProgress() {
			ui.textBar.textContent =
				`${state.matchedPairs}/` +
				`${totalPairs} Pasangan | ` +
				`${state.attempts} Percubaan`;

			const progress =
				totalPairs === 0
					? 0
					: (
						state.matchedPairs /
						totalPairs
					) * 100;

			ui.barFill.style.width =
				`${progress}%`;
		}


		// =====================================
		// 10. MESEJ
		// =====================================

		function showMessage(
			message,
			status = "normal"
		) {
			ui.dialog.textContent = message;

			ui.dialog.classList.remove(
				"textBetul",
				"textSalah"
			);

			ui.dialog.style.color = "";

			if (status === "correct") {
				ui.dialog.classList.add(
					"textBetul"
				);

				ui.dialog.style.color =
					"#22a000";
			}

			if (status === "wrong") {
				ui.dialog.classList.add(
					"textSalah"
				);

				ui.dialog.style.color =
					"#e53935";
			}
		}


		// =====================================
		// 11. RESET TURN
		// =====================================

		function resetTurn() {
			state.firstCard = null;
			state.secondCard = null;
			state.isLocked = false;
		}


		// =====================================
		// 12. PASANGAN BETUL
		// =====================================

		function handleCorrectPair(
			firstCard,
			secondCard
		) {
			state.matchedPairs++;

			firstCard.classList.add(
				"matched"
			);

			secondCard.classList.add(
				"matched"
			);

			firstCard.style.pointerEvents =
				"none";

			secondCard.style.pointerEvents =
				"none";

			showMessage(
				"Betul! Pasangan yang sama ditemui.",
				"correct"
			);

			updateProgress();
			resetTurn();

			if (
				state.matchedPairs ===
				totalPairs
			) {
				finishGame();
			}
		}


		// =====================================
		// 13. PASANGAN SALAH
		// =====================================

		function handleWrongPair(
			firstCard,
			secondCard
		) {
			showMessage(
				"Bukan pasangan yang sama. Cuba lagi!",
				"wrong"
			);

			state.timeoutId =
				setTimeout(() => {
					unflipCard(firstCard);
					unflipCard(secondCard);

					resetTurn();

					showMessage(
						currentData.text
					);
				}, 800);
		}


		// =====================================
		// 14. SEMAK DUA KAD
		// =====================================

		function checkCards() {
			state.attempts++;
			state.isLocked = true;

			const firstCard =
				state.firstCard;

			const secondCard =
				state.secondCard;

			const firstPairId =
				firstCard.dataset.pairId;

			const secondPairId =
				secondCard.dataset.pairId;

			const isSamePair =
				firstPairId === secondPairId;

			updateProgress();

			if (isSamePair) {
				state.timeoutId =
					setTimeout(() => {
						handleCorrectPair(
							firstCard,
							secondCard
						);
					}, 400);

				return;
			}

			handleWrongPair(
				firstCard,
				secondCard
			);
		}


		// =====================================
		// 15. KLIK KAD
		// =====================================

		function handleCardClick(event) {
			const card =
				event.target.closest(".card");

			if (
				!card ||
				!ui.memoryContainer.contains(card)
			) {
				return;
			}

			if (
				state.phase !== "playing" ||
				state.isLocked
			) {
				return;
			}

			if (
				card === state.firstCard ||
				card.classList.contains(
					"matched"
				)
			) {
				return;
			}

			flipCard(card);

			if (!state.firstCard) {
				state.firstCard = card;

				showMessage(
					"Pilih satu lagi kad."
				);

				return;
			}

			state.secondCard = card;

			checkCards();
		}


		// =====================================
		// 16. TAMAT GAME
		// =====================================

		function finishGame() {
			state.phase = "complete";
			state.isLocked = true;

			ui.barFill.style.width =
				"100%";

			ui.textBar.textContent =
				`${totalPairs}/${totalPairs} ` +
				`Pasangan`;

			showMessage(
				`Tahniah! Semua pasangan ` +
				`ditemui dalam ` +
				`${state.attempts} percubaan.`,
				"correct"
			);

			ui.btnContinue.textContent =
				"MAIN SEMULA";

			ui.btnContinue.classList.remove(
				"hidden"
			);
		}


		// =====================================
		// 17. MULA / RESTART
		// =====================================

		function startGame() {
			clearTimeout(state.timeoutId);

			state.firstCard = null;
			state.secondCard = null;

			state.isLocked = false;

			state.matchedPairs = 0;
			state.attempts = 0;

			state.phase = "playing";

			showMessage(currentData.text);

			ui.btnContinue.classList.add(
				"hidden"
			);

			renderCards();
			updateProgress();
		}


		// =====================================
		// 18. EVENT LISTENER
		// =====================================

		ui.memoryContainer.addEventListener(
			"click",
			handleCardClick
		);

		ui.btnContinue.addEventListener(
			"click",
			startGame
		);


		// =====================================
		// 19. MULA GAME
		// =====================================

		startGame();

	</script>

</body>

</html>
