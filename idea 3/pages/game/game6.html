			/*

			*/

			{
				id: "padankan-1",

				text:

				type: "padankan",

				content: {
					items: [
						{

							answer: 11
						}
					]
				}
			}
		];

		const state = {
			index: 0,
			phase: "rendering",
			cleanup: null,
			currentResult: null
		};

		const ui = {
			contentContainer:
				document.querySelector(
					".contentContainer"
				),

			dialog:
				document.querySelector(
					".dialog p"
				),

			textBar:
				document.querySelector(
					".text-bar"
				),

			barFill:
				document.querySelector(
					".barFill"
				),

			btnCheck:
				document.querySelector(
					".btnCheck"
				),

			btnContinue:
				document.querySelector(
					".btnContinue"
				)
		};


		// =====================================
		// 4. ADAPTER UI
		// =====================================

		function showMessage(
			message,
			status = "normal"
		) {
			showMessagee(
				ui,
				message,
				status
			);
		}

		function updateSubProgress(
			completed,
			total,
			attempts
		) {
			const percentage =
				total === 0
					? 0
					: (completed / total) * 100;

			ui.textBar.textContent =
				`${completed}/${total} Pasangan | ` +
				`${attempts} Percubaan`;

			ui.barFill.style.width =
				`${percentage}%`;
		}


		// =====================================
		// 5. RENDER COMPONENT
		// =====================================

		function renderCurrentComponent() {
			state.cleanup?.();

			state.cleanup = null;
			state.currentResult = null;

			const currentData =
				json[state.index];

			if (!currentData) {
				finishAllComponents();
				return;
			}

			const component =
				widgetRegistry[currentData.type];

			if (!component?.mount) {
				showMessage(
					`Component "${currentData.type}" ` +
					`tidak dijumpai.`,
					"wrong"
				);

				return;
			}

			state.phase = "playing";

			ui.btnCheck.classList.add("hidden");
			ui.btnContinue.classList.add("hidden");

			const root =
				document.createElement("div");

			root.className = "output w-100";

			ui.contentContainer.replaceChildren(
				root
			);

			console.log(currentData.content);

			state.cleanup = component.mount({
				root,

				data: currentData,

				ui: {
					showMessage,
					updateSubProgress
				},

				complete:
					handleComponentComplete
			});
		}


		// =====================================
		// 6. COMPONENT SELESAI
		// =====================================

		function handleComponentComplete(result) {
			if (state.phase !== "playing") {
				return;
			}

			state.phase =
				"component-complete";

			state.currentResult = result;

			const isLastComponent =
				state.index === json.length - 1;

			ui.btnContinue.textContent =
				isLastComponent
					? "FINISH"
					: "CONTINUE";

			ui.btnContinue.classList.remove(
				"hidden"
			);
		}


		// =====================================
		// 7. COMPONENT SETERUSNYA
		// =====================================

		function handleContinue() {
			if (
				state.phase !==
				"component-complete"
			) {
				return;
			}

			state.index++;

			renderCurrentComponent();
		}


		// =====================================
		// 8. SEMUA SELESAI
		// =====================================

		function finishAllComponents() {
			state.cleanup?.();

			state.cleanup = null;
			state.phase = "complete";

			showMessage(
				"Semua aktiviti telah selesai!",
				"correct"
			);

			ui.contentContainer.innerHTML = `
			<div class="output">
				<div class="soft-box p-2">

					<h1>Tahniah!</h1>

					<p>
						Anda telah menyelesaikan
						semua aktiviti.
					</p>

				</div>
			</div>
		`;

			ui.textBar.textContent =
				`${json.length}/${json.length} Aktiviti`;

			ui.barFill.style.width = "100%";

			ui.btnCheck.classList.add("hidden");
			ui.btnContinue.classList.add("hidden");

			localStorage.setItem(
				"game8Completed",
				"true"
			);
		}


		ui.btnContinue.addEventListener(
			"click",
			handleContinue
		);

		renderCurrentComponent();

	</script>
